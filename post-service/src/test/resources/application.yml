server:
  port: 8082

spring:
  application:
    name: post-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  cloud:
    consul:
      enabled: false
    discovery:
      enabled: false

logging:
  level:
    com.instagram.post: DEBUG
