services:
  mysql:
    image: mysql:8.0
    container_name: instagram-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/ddl-script.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:latest
    container_name: instagram-consul
    ports:
      - "8500:8500"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0

  authentication-service:
    build:
      context: ./authentication-service
      dockerfile: Dockerfile
    container_name: instagram-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/instagram_auth?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_started

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: instagram-posts
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/instagram_posts?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONSUL_HOST: consul
      MEDIA_BASE_URL: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_started

  follow-service:
    build:
      context: ./follow-service
      dockerfile: Dockerfile
    container_name: instagram-follows
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/instagram_follows?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_started

  trending-service:
    build:
      context: ./trending-service
      dockerfile: Dockerfile
    container_name: instagram-trending
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/instagram_trending?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: instagram-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_CONSUL_HOST: consul
    depends_on:
      - consul
      - authentication-service
      - post-service
      - follow-service
      - trending-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: instagram-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
